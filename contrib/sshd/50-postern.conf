# Postern tunnel user.
# vps-bootstrap.sh splits this file: keywords above the first Match line go
# in sshd_config.d (global). The Match block is appended at EOF of
# sshd_config so Debian's Include-at-top cannot wrap UsePAM /
# PermitRootLogin (that lockout looks like "root SSH died after install").
# Close the Match so later keywords are not captured. See sshd_config(5).
#
# PermitUserEnvironment is global-only (illegal inside Match on OpenSSH).
# The pattern-list still restricts which authorized_keys environment=
# names are accepted.
#
# scripts/vps-bootstrap.sh installs this file and runs sshd -t (hard-fail)
# before systemctl reload ssh. Do not set MaxStartups here (it is global).
PermitUserEnvironment POSTERN_NAME,POSTERN_ROLE
Match User postern
    AllowTcpForwarding remote
    GatewayPorts no
    PermitOpen none
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY no
    PermitTunnel no
    AllowStreamLocalForwarding no
    ClientAliveInterval 30
    ClientAliveCountMax 3
    AuthorizedKeysFile /var/lib/postern/authorized_keys
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    ForceCommand /usr/bin/posternd-shell
Match all
